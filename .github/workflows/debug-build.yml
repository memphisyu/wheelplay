name: Android Debug Build

on:
  push:
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'

      - name: Build and verify Debug
        run: ./gradlew --no-daemon :shared:testDebugUnitTest :common:testDebugUnitTest :common:assembleDebugAndroidTest :mobile:lintDebug :mobile:assembleDebug

      - name: Upload browser runtime test APK
        uses: actions/upload-artifact@v4
        with:
          name: wheelplay-browser-runtime-tests
          path: common/build/outputs/apk/androidTest/debug/common-debug-androidTest.apk
          if-no-files-found: error

      - name: Upload Debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wheelplay-debug-apk
          path: mobile/build/outputs/apk/debug/mobile-debug.apk
          if-no-files-found: warn

      - name: Upload Lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wheelplay-lint-results
          path: mobile/build/reports/lint-results-debug.*
          if-no-files-found: warn

  browser-runtime:
    name: Browser HTTP on Android ${{ matrix.api-level }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api-level: [28, 36]
    steps:
      - name: Download browser runtime test APK
        uses: actions/download-artifact@v4
        with:
          name: wheelplay-browser-runtime-tests
          path: runtime-tests

      - name: Enable KVM
        run: sudo chmod a+rw /dev/kvm

      - name: Verify browser entry pages and media assets
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r runtime-tests/common-debug-androidTest.apk
            adb shell am instrument -w -r -e class com.shilapi.xcertplay.web.BrowserPageRuntimeTest com.shilapi.xcertplay.host.test/androidx.test.runner.AndroidJUnitRunner > browser-runtime.log
            cat browser-runtime.log
            grep -Eq '^OK \([1-9][0-9]* tests?\)' browser-runtime.log

      - name: Upload runtime test result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-runtime-api-${{ matrix.api-level }}
          path: browser-runtime.log
          if-no-files-found: warn

  browser-and-native:
    name: Browser presentation and native video regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install media verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - run: npm ci --no-audit --no-fund
      - run: npm test && npm run check
      - name: Real Chromium presentation regression
        env:
          BROWSER_BIN: google-chrome
          FFMPEG_BIN: /usr/bin/ffmpeg
        run: npm run test:browser:media
      - name: Native framing and packetizer sanitizers
        run: |
          clang++ -std=c++17 -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer -Icommon/src/main/cpp test/native/video-buffer.cpp -o "$RUNNER_TEMP/video-buffer-test"
          "$RUNNER_TEMP/video-buffer-test"
          clang++ -std=c++17 -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer -Icommon/src/main/cpp test/native/video-packetizer.cpp -o "$RUNNER_TEMP/video-packetizer-test"
          "$RUNNER_TEMP/video-packetizer-test"
